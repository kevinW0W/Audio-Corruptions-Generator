name: Deploy Audio Corruption to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the static app (exclude local HTTPS credentials)
        shell: bash
        run: |
          mkdir -p _site/PWA
          cp index.html audio-corruptions.html audio-corruptions.css audio-corruptions.svg apple-touch-icon-v2.png manifest.webmanifest service-worker.js _site/
          cp -R icons styles vendor _site/
          cp PWA/offline.html PWA/service-worker.js _site/PWA/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
