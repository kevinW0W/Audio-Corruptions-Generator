<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <link rel="icon" type="image/svg+xml" href="../audio-corruptions.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon-v2.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Audio Corruption">
  <title>Audio Corruption</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #080c14; }
    body { overflow: hidden; }
    #studio { display: block; width: 100%; height: 100%; border: 0; background: #080c14; }
    #offlineMessage { display: none; min-height: 100%; place-items: center; padding: 24px; color: #e2e8f0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #offlineMessage article { width: min(100%, 440px); padding: 28px; border: 1px solid #1e293b; border-radius: 24px; background: #0f172a; text-align: center; }
    #offlineMessage h1 { margin: 0 0 10px; font-size: 1.25rem; }
    #offlineMessage p { margin: 0; color: #94a3b8; }
  </style>
</head>
<body>
  <iframe id="studio" title="Audio Stutter Studio" allow="autoplay; microphone"></iframe>
  <main id="offlineMessage" role="status">
    <article>
      <h1>Audio Stutter Studio is not cached yet</h1>
      <p>Reconnect to this address, open the studio once, and wait for it to finish loading. Then the app can launch offline.</p>
    </article>
  </main>
  <script>
    // This is the install/start page. Keep this URL visible while the studio
    // runs in a same-origin frame; when used as the worker's last-resort
    // fallback for another URL, show a useful message instead of nesting frames.
    if (location.pathname.endsWith('/PWA/offline.html')) {
      document.getElementById('studio').src = '../audio-corruptions.html';
    } else {
      document.getElementById('studio').remove();
      document.getElementById('offlineMessage').style.display = 'grid';
    }
  </script>
</body>
</html>
